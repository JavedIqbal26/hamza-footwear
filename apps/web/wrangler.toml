#:schema node_modules/wrangler/config-schema.json
# Cloudflare Pages configuration for the storefront.
#
# These bindings are what `astro dev` proxies through Miniflare locally and what
# the deployed Pages project uses in production. The D1 `database_id` is filled
# in after `wrangler d1 create hamza-footwear-db`.

name = "hamza-footwear"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "hamza-footwear-db"
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "../../db/migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "hamza-footwear-images"

[vars]
# All placeholders. Set the real values in the Pages dashboard before launch.
#
# The shop's WhatsApp number, and both wallet accounts. Today they are one and
# the same number, but they stay three settings: the wallet can move without
# the WhatsApp line moving with it, and a shared constant would make that a
# code change instead of a dashboard one.
SHOP_WHATSAPP = "03000142825"

# Where the customer sends the advance. A wallet is hidden entirely unless its
# number is set, so nobody is ever shown a blank number to send money to —
# delete a line to withdraw that wallet.
JAZZCASH_NUMBER = "03000142825"
EASYPAISA_NUMBER = "03000142825"

# Order notifications are configured as secrets, not here:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#   wrangler secret put RESEND_API_KEY
# A missing channel is skipped and logged; it never fails an order.
