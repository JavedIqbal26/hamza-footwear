#:schema node_modules/wrangler/config-schema.json
# Admin / write API Worker.
#
# Sits behind Cloudflare Access; there is no auth code in the application.

name = "hamza-footwear-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# NOT ROUTED, AND DELIBERATELY SO.
#
# The admin API is served by the storefront's Pages project, which mounts this
# same Hono app at apps/web/src/pages/api/admin/[...path].ts. Cloudflare Access
# and Worker routes cannot both apply to one path on a Pages custom domain —
# once Access processes a request it forwards to the Pages origin and the Worker
# route never fires.
#
# This config stays for local development (`npm run dev:api`), and because the
# bindings below document what the API needs. Do not add a route back without
# removing the Astro mount first: two live copies of the same API, only one of
# them behind Access, is exactly the shape of an accident.
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "hamza-footwear-db"
database_id = "83afab33-3da3-4bda-a87a-27c1317e42cd"
migrations_dir = "../../db/migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "hamza-footwear-images"

# Secrets are set with `wrangler secret put`, never in this file:
#   TELEGRAM_BOT_TOKEN  — admin needs it to read the chat id back via Connect
#   VAPID_PUBLIC_KEY    — handed to the browser so it can subscribe to push
#
# The VAPID *private* key belongs to the storefront Worker, which does the
# sending. This one never signs anything and must not hold it.
